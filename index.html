<body>
 <header class="header" role="banner">
  <div class="card">
    <h1>bw.OUTLINED</h1>
    <h2>Image to B&W Outline Converter</h2>
 </header>

<div>
    <div class="controls">
      <label class="btn" for="upload">Choose Image</label>
      <input type="file" id="upload" accept="image/*" />
      
      <div>
        <label for="threshold">Sensitivity (Edge Threshold): </label>
        <input type="range" id="threshold" min="10" max="150" value="30" />
      </div>
    </div>

    <canvas id="canvas"></canvas>
  </div>

  <script>
    // 1. Register Service Worker for PWA Offline Support
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker Registered'))
        .catch(err => console.error('SW Registration Failed:', err));
    }

    // 2. Image Processing & Canvas Manipulation
    const upload = document.getElementById('upload');
    const thresholdInput = document.getElementById('threshold');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let loadedImage = null;

    upload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        loadedImage = new Image();
        loadedImage.onload = () => processImage();
        loadedImage.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    thresholdInput.addEventListener('input', () => {
      if (loadedImage) processImage();
    });

    function processImage() {
      const w = loadedImage.width;
      const h = loadedImage.height;
      canvas.width = w;
      canvas.height = h;

      // Draw original image
      ctx.drawImage(loadedImage, 0, 0, w, h);
      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;

      // Convert to Grayscale Luma Array
      const gray = new Uint8ClampedArray(w * h);
      for (let i = 0; i < data.length; i += 4) {
        // Luminance formula
        gray[i / 4] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      }

      const threshold = parseInt(thresholdInput.value, 10);
      const output = ctx.createImageData(w, h);
      const outData = output.data;

      // Sobel operator / Simple Difference Edge Detection
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = y * w + x;
          const outIdx = idx * 4;

          // Boundary check
          if (x === w - 1 || y === h - 1) {
            outData[outIdx] = 255;
            outData[outIdx + 1] = 255;
            outData[outIdx + 2] = 255;
            outData[outIdx + 3] = 255;
            continue;
          }

          // Compare pixel brightness to right and bottom neighbors
          const current = gray[idx];
          const right = gray[idx + 1];
          const bottom = gray[idx + w];

          const diffX = Math.abs(current - right);
          const diffY = Math.abs(current - bottom);
          const edge = diffX + diffY;

          // If edge strength exceeds threshold, draw BLACK (outline), else WHITE
          const val = edge > threshold ? 0 : 255;

          outData[outIdx] = val;     // R
          outData[outIdx + 1] = val; // G
          outData[outIdx + 2] = val; // B
          outData[outIdx + 3] = 255; // Alpha
        }
      }

      ctx.putImageData(output, 0, 0);
    }
  </script>
